# See https://github.com/podman-container-tools/container-libs/blob/main/common/pkg/config/containers.conf
# and https://github.com/containers/image_build/blob/main/podman/containers.conf
[containers]
netns="host"
userns="host"
ipcns="host"
utsns="host"
cgroupns="host"
pidns="host"
cgroups="enabled"
log_driver = "k8s-file"
[engine]
cgroup_manager = "cgroupfs"
events_logger="file"
runtime="crun"
